plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.20'
    id 'mindofthecolony.mixin-generator'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft.accessTransformers.file 'src/main/resources/META-INF/accesstransformer.cfg'

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main

        // Mixin configuration
        jvmArgument '-Dmixin.env.remapRefMap=true'
        jvmArgument '-Dmixin.env.refMapRemappingFile=' + file('build/createSrgToMcp/output.srg').absolutePath
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Include generated mixin sources in main compilation
sourceSets.main.java {
    srcDir 'src/generated/mixins/java'
}

// Wire mixin generation before compilation
tasks.named('compileJava') {
    dependsOn 'generateForkMixins'
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    maven {
        name = 'LDTTeam - Modding'
        url = 'https://ldtteam.jfrog.io/ldtteam/modding/'
    }
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    mavenCentral()
}

dependencies {
    // NeoForge
    implementation "net.neoforged:neoforge:${neo_version}"

    // Mixin
    compileOnly 'org.spongepowered:mixin:0.8.7'
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'

    // java-npc library (via composite build, embedded via jarJar for runtime)
    implementation 'game.player2.npc:player2npc:1.0.0'
    jarJar('game.player2.npc:player2npc') {
        version {
            strictly '[1.0.0,2.0.0)'
            prefer '1.0.0'
        }
    }

    // MineColonies and dependencies
    compileOnly "com.ldtteam:minecolonies:${minecolonies_version}"
    compileOnly "com.ldtteam:structurize:${structurize_version}"
    compileOnly "com.ldtteam:blockui:${blockui_version}"
    compileOnly "com.ldtteam:multipiston:${multipiston_version}"
    compileOnly "com.ldtteam:domum-ornamentum:${domum_ornamentum_version}"

    // JEI API (needed to compile fork's JEI integration code)
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:19.19.6.235"

    // JourneyMap API (needed to compile fork's JourneyMap compatibility code)
    compileOnly group: 'info.journeymap', name: 'journeymap-api-neoforge', version: '2.0.0-1.21.1-SNAPSHOT', changing: true

    // Dynamic Trees (needed to compile fork's Dynamic Trees compatibility code)
    compileOnly "maven.modrinth:dynamictrees:1.5.0-BETA07"

    // Runtime dependencies for testing
    localRuntime "com.ldtteam:minecolonies:${minecolonies_version}"
    localRuntime "com.ldtteam:structurize:${structurize_version}"
    localRuntime "com.ldtteam:blockui:${blockui_version}"
    localRuntime "com.ldtteam:multipiston:${multipiston_version}"
    localRuntime "com.ldtteam:domum-ornamentum:${domum_ornamentum_version}"

    // Jade (tooltip/overlay mod for testing)
    localRuntime "maven.modrinth:jade:15.10.3+neoforge"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : mod_authors,
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'MixinConfigs'            : 'mindofthecolony.mixins.json,mindofthecolony-generated.mixins.json'
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
