pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Local java-npc build (feature/tts branch with TTS support)
includeBuild('../java-npc') {
    dependencySubstitution {
        substitute module('game.player2.npc:player2npc') using project(':')
    }
}

rootProject.name = 'mindofthecolony'
